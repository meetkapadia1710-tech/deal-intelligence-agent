services:
  # BACKEND SERVICE
  - type: web
    name: deal-intelligence-api
    env: node
    region: ohio
    plan: starter # A paid plan is required for Persistent Disks
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # SQLite DB needs to point to the persistent disk path
      - key: DATABASE_URL
        value: "file:/var/data/prod.db"
      # These must be filled in the Render Dashboard
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: HINDSIGHT_BASE_URL
        value: "https://api.hindsight.vectorize.io"
      - key: GROQ_API_KEY
        sync: false
    # Attach a persistent disk for SQLite so data survives deploys
    disk:
      name: deal-intelligence-data
      mountPath: /var/data
      sizeGB: 1

  # FRONTEND SERVICE
  - type: web
    name: deal-intelligence-web
    env: static
    region: ohio
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: deal-intelligence-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: REACT_APP_CLERK_PUBLISHABLE_KEY
        sync: false
