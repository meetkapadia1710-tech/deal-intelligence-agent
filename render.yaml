services:
  # BACKEND SERVICE
  - type: web
    name: deal-intelligence-api
    env: node
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        value: "file:./prod.db"
      # These must be filled in the Render Dashboard
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: HINDSIGHT_BASE_URL
        value: "https://api.hindsight.vectorize.io"
      - key: GROQ_API_KEY
        sync: false

  # FRONTEND SERVICE
  - type: web
    name: deal-intelligence-web
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: deal-intelligence-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: REACT_APP_CLERK_PUBLISHABLE_KEY
        sync: false
